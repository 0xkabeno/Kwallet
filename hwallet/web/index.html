body[data-theme="light"]{--bg:#f8f9fa;--card:#ffffff;--card2:#f1f3f4;--line:#e6e8eb;--border:#dadce0;--text:#202124;--muted:#5f6368;--soft:#80868b;--acc:#223348;--accI:#ffffff;--accT:#223348;--pill:#e8ecf2;--up:#188038;--dn:#d93025;--warn:#a86f00;--warnBg:#fff4dc;--errBg:#fce8e6;--navbg:#ffffff;--sel:#e3e8ef}
/* Kwallet dark (navy) */
body[data-theme="dark"]{--bg:#0e1117;--card:#151b25;--card2:#1d2532;--line:#222b3a;--border:#2a3446;--text:#d9e2ef;--muted:#8494ab;--soft:#5f6c85;--acc:#ddf869;--accI:#223348;--accT:#ddf869;--pill:#232c3b;--up:#34c77b;--dn:#f2665e;--warn:#f0c14b;--warnBg:#3a321d;--errBg:#3a2224;--navbg:#121822;--sel:#26313f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:RobotoE,Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;overscroll-behavior-y:contain}
body{min-height:100vh;user-select:none;-webkit-user-select:none;transition:background-color .25s ease}
input,textarea{user-select:text;-webkit-user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.app{max-width:600px;margin:0 auto;padding:calc(var(--sat) + 2px) 16px calc(var(--sab) + var(--nav) + 24px);contain:layout style}
.app.in{animation:pgIn .26s var(--ease)}
.app.back{animation:pgBack .22s var(--ease)}
@keyframes pgIn{from{opacity:.001;transform:translate3d(18px,0,0)}to{opacity:1;transform:none}}
@keyframes pgBack{from{opacity:.001;transform:translate3d(-14px,0,0)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:.001;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}
.ic{width:24px;height:24px;display:block;flex:0 0 auto}.ic.sm{width:20px;height:20px}.ic.xs{width:16px;height:16px}
.mono{font-family:"Roboto Mono",RobotoMonoE,ui-monospace,Menlo,monospace;letter-spacing:.2px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.mute{color:var(--muted)}
/* ripple-free press feedback, compositor only */
.tap{transition:transform .12s ease,background-color .15s ease}.tap:active{transform:scale(.985)}
/* ---------- top bars ---------- */
.bar{display:flex;align-items:center;height:56px;gap:6px}
.ib,.ib0{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;color:var(--text)}
.ib:active{background:var(--card2)}
.bt{flex:1;text-align:center;font-size:19px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt.l{text-align:left;padding-left:4px;font-size:22px;font-weight:700}
.hbar{display:flex;align-items:center;gap:8px;height:60px}
/* the OG Hwallet brand pill (same build as Kwallet's) */
.hbrand{display:inline-flex;align-items:center;height:32px;padding:0 9px;border-radius:10px;background:#DDF869;font:900 18px/1 KwBlack,RobotoE,system-ui;letter-spacing:-.4px;box-shadow:inset 0 -3px 0 rgba(34,51,72,.13),0 1px 2px rgba(34,51,72,.16);white-space:nowrap;flex:0 0 auto}
.hbrand .hk{color:#223348;margin-right:.5px;transform:translateY(.5px)}
.hbrand .hw{color:#fff;font-size:15px;letter-spacing:.3px;-webkit-text-stroke:1.5px #223348;paint-order:stroke fill;text-shadow:0 1.5px 0 #223348}
.hbrand.big{height:52px;padding:0 15px;border-radius:16px;font-size:30px;box-shadow:inset 0 -5px 0 rgba(34,51,72,.14),0 2px 6px rgba(34,51,72,.18)}
.hbrand.big .hw{font-size:25px;-webkit-text-stroke-width:2.2px;text-shadow:0 2px 0 #223348}
.wsw{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 8px 0 12px;border-radius:12px;background:var(--pill);font-size:15px;font-weight:600;max-width:46vw;min-width:0}
.wsw span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsw .ic{width:18px;height:18px;color:var(--muted)}
.sp1{flex:1}
/* ---------- hero ---------- */
.hero{text-align:center;padding:18px 0 4px}
.tot{font-size:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:-1.2px;line-height:1.1;font-variant-numeric:tabular-nums}
.chg{font-size:15px;margin-top:8px;min-height:20px;font-weight:500;font-variant-numeric:tabular-nums}
.acts{display:flex;justify-content:center;gap:28px;margin:22px 0 24px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:68px}
.ac{width:56px;height:56px;border-radius:18px;background:var(--acc);color:var(--accI);display:grid;place-items:center;transition:transform .12s ease}
.act:active .ac{transform:scale(.92)}
.act[data-off] .ac{opacity:.38}
.al2{font-size:14px;color:var(--text);font-weight:500}
/* ---------- Gem list: rows as separate rounded cards ---------- */
.lst{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.lst>*{background:var(--card);border-radius:6px}
.lst>*:first-child{border-top-left-radius:var(--r);border-top-right-radius:var(--r)}
.lst>*:last-child{border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r)}
.ar{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:12px 16px;content-visibility:auto;contain-intrinsic-size:auto 76px}
.ar:active{background:var(--card2)}
.ar.sm{min-height:66px}
.lw{position:relative;flex:0 0 auto;width:46px;height:46px}
.lg{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 auto;display:block;background:transparent}
.lg.big{width:72px;height:72px}.lg.md{width:40px;height:40px}.lg.xs{width:22px;height:22px}
.lw.big{width:72px;height:72px}.lw.md{width:40px;height:40px}
.bdg{position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;box-shadow:0 0 0 2px var(--card);object-fit:cover;background:transparent}
.lw.big .bdg{width:26px;height:26px;right:-2px;bottom:-2px;box-shadow:0 0 0 3px var(--bg)}
.lt{display:grid;place-items:center;background:var(--card2);color:var(--muted);font-weight:700;font-size:18px}
.lt .ic{width:22px;height:22px}.lt.bad{color:var(--dn)}.lt.in{color:var(--up)}.lt.pl{color:var(--accT)}
.lgw{position:relative;overflow:hidden;background:var(--card2)}.lgw .in2{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:18px}.lgw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.lw.big .lt,.lw.big .lgw .in2{font-size:28px}
.am{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.an{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.ap{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ax{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0;flex:0 1 auto}
.aa{font-size:17px;font-weight:500;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;max-width:48vw;overflow:hidden;text-overflow:ellipsis}
.au{font-size:15px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.aa.mute{color:var(--soft);font-weight:400;font-size:15px}
.chev{width:20px;height:20px;color:var(--soft)}
.sech{display:flex;align-items:center;justify-content:space-between;font-size:15px;color:var(--muted);font-weight:600;margin:20px 6px 8px}
.sech button{color:var(--accT);font-weight:600;font-size:14px;padding:4px 2px}body[data-theme="light"] .sech button{color:var(--acc)}
.more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:52px;font-size:15px;font-weight:600;color:var(--muted)}
.more .ic{width:20px;height:20px;transition:transform .2s ease}.more.open .ic{transform:rotate(180deg)}
.coll{display:none}.coll.open{display:contents}
/* key-value rows (Gem info rows) */
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:12px 16px;font-size:16px}
.kv>span:first-child{flex:0 0 auto;color:var(--text)}
.kv>span:last-child{color:var(--muted);text-align:right;display:flex;align-items:center;gap:8px;min-width:0;justify-content:flex-end}
.kv .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.kv:active{background:var(--card2)}
/* settings rows */
.sr{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:10px 16px;font-size:16px}
.sr:active{background:var(--card2)}
.sri{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card2);color:var(--text);flex:0 0 auto}
.sri .ic{width:20px;height:20px}
.srt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.srt b{font-weight:500}.srt small{color:var(--muted);font-size:13.5px;line-height:1.35}
.srv{color:var(--muted);font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sw{width:46px;height:28px;border-radius:999px;background:var(--border);position:relative;flex:0 0 auto;transition:background-color .2s ease}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.on>.sw,.sw.on{background:var(--acc)}.on>.sw::after,.sw.on::after{transform:translateX(18px)}
body[data-theme="dark"] .on>.sw::after{background:#223348}
.seg{display:inline-flex;background:var(--card2);border-radius:12px;padding:3px;gap:2px}
.seg button{text-align:center;height:32px;padding:0 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.14)}
body[data-theme="dark"] .seg button.on{background:var(--sel)}
.seg button[hidden]{display:none}
.ver{color:var(--soft);font-size:13px;text-align:center;margin:12px 0 4px;line-height:1.5}
/* ---------- coin page ---------- */
.chero{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 0}
.chero .lw{margin-bottom:12px}
.cam{font-size:36px;font-weight:700;letter-spacing:-.8px;text-align:center;line-height:1.15;word-break:break-word;font-variant-numeric:tabular-nums}
.cus{font-size:16px;color:var(--muted);min-height:20px;font-variant-numeric:tabular-nums}
.why{color:var(--muted);font-size:14px;line-height:1.45;text-align:center;margin:-8px 12px 18px}
/* TronLink-style resources bar */
.res{background:var(--card);border-radius:var(--r);padding:14px 16px 12px;margin:-6px 0 14px}
.resb{display:flex;gap:4px;height:6px}
.resb i{display:block;height:100%;border-radius:3px;position:relative;overflow:hidden}
.resb i b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;transition:width .5s var(--ease)}
.resb .en{background:color-mix(in srgb,#3d5afe 22%,transparent)}.resb .en b{background:#3d5afe}
.resb .bw{background:color-mix(in srgb,#7ed321 28%,transparent)}.resb .bw b{background:#5fbf16}
.resl{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:14px;font-variant-numeric:tabular-nums}
.resl span{display:inline-flex;align-items:center;gap:6px}.resl em{font-style:normal;color:var(--muted)}
.resl .q{width:9px;height:9px;border-radius:2px;display:inline-block}
.res .rx{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--muted)}
/* activity */
.dh{font-size:14px;font-weight:600;color:var(--muted);margin:18px 6px 8px}
.dh:first-child{margin-top:6px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:40px 20px 20px;animation:fadeUp .3s var(--ease)}
.eb{width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--muted);margin-bottom:10px}.eb .ic{width:36px;height:36px}
.empty b{font-size:18px;font-weight:600}.empty span{color:var(--muted);font-size:15px;line-height:1.45}
.ldr{display:flex;justify-content:center;padding:18px;color:var(--muted);font-size:14px;min-height:56px}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--muted);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.st-ok{color:var(--muted)}.st-fail{color:var(--dn)}.st-pending{color:var(--warn)}
.pend{display:inline-flex;align-items:center;gap:4px}
/* search */
.srch{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;height:50px;margin:4px 0 14px}
.srch input{flex:1;border:0;outline:0;background:transparent;font-size:16px;min-width:0}
.srch .ic{color:var(--muted)}
/* forms */
.form,.setup{padding-top:4px}
.lbl{font-size:14px;color:var(--muted);font-weight:600;margin:16px 6px 8px}
.inp{display:flex;align-items:center;background:var(--card);border-radius:16px;padding:4px 6px 4px 14px;min-height:56px;border:1.5px solid transparent;transition:border-color .15s ease}
.inp:focus-within{border-color:var(--soft)}
.inp input,.inp textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16.5px;padding:10px 0}
.inp textarea{resize:none;font-family:"Roboto Mono",ui-monospace,monospace;font-size:14px}
.pb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--accT);flex:0 0 auto}body[data-theme="light"] .pb{color:var(--acc)}
.pb:active{background:var(--card2)}
.amt .sym{color:var(--muted);font-weight:500;margin:0 8px}
.mx{font-weight:700;font-size:14px;background:var(--card2);border-radius:10px;padding:8px 12px;margin-right:4px}
.hint2{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13.5px;margin:8px 6px 0;font-variant-numeric:tabular-nums}
.seg.wide{display:flex;background:var(--card);border-radius:14px;padding:4px}
.seg.wide button{flex:1;height:42px;font-size:15px}
body[data-theme] .seg.wide button.on{background:var(--acc);color:var(--accI);box-shadow:none}
.note{background:var(--card);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;color:var(--muted);margin-top:10px}
.note.warn{background:var(--errBg);color:var(--dn)}.note.ok{color:var(--up)}
.note[hidden]{display:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;background:var(--card);font-weight:600;font-size:16px;padding:0 20px;flex:1;text-align:center;transition:transform .12s ease,opacity .15s ease}
.btn:active:not(:disabled){transform:scale(.98)}
.btn .ic{width:20px;height:20px}
.btn.pri{background:var(--acc);color:var(--accI)}
.btn.dng{color:var(--dn)}
.btn.wide{width:100%;margin-top:14px}.btn.big{height:56px;margin-top:22px}
.btn:disabled{opacity:.4}
.hint{color:var(--muted);font-size:13.5px;line-height:1.45;text-align:center;margin:10px 8px 0}
/* setup / pair (#18) */
.wel{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 8px 18px;animation:fadeUp .35s var(--ease)}
.wel h2{font-size:26px;font-weight:700;margin:18px 0 6px;letter-spacing:-.3px}
.wel p{color:var(--muted);font-size:15px;line-height:1.5;max-width:340px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px;background:var(--card);border-radius:var(--r);margin-bottom:10px;text-align:left}
.opt:active{background:var(--card2)}
.opt .oi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--acc);color:var(--accI);flex:0 0 auto}
.opt .oi.alt{background:var(--card2);color:var(--text)}
.opt b{display:block;font-size:17px;font-weight:600}.opt small{display:block;color:var(--muted);font-size:14px;margin-top:2px;line-height:1.4}
.box{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px}
.box .inp{background:var(--card2)}
.box h4{font-size:16px;font-weight:600;margin:2px 2px 10px}
.man summary{list-style:none;display:flex;align-items:center;gap:8px;font-weight:600;padding:4px 2px;color:var(--text);cursor:pointer}
.man summary::-webkit-details-marker{display:none}
.man summary .ic{margin-left:auto;color:var(--muted);transition:transform .2s ease}.man[open] summary .ic{transform:rotate(180deg)}
.man .inp{background:var(--card2)}
.wrow{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 12px 10px 16px}
.wav{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#DDF869;color:#223348;font:900 18px/1 KwBlack,RobotoE,system-ui;flex:0 0 auto;box-shadow:inset 0 -2px 0 rgba(34,51,72,.13)}
.wrow .ok{color:var(--up)}
/* sheets */
.sheet-ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;transition:background-color .22s ease}
.sheet-ov.show{background:rgba(0,0,0,.45)}
.sheet{width:100%;max-width:600px;background:var(--bg);border-radius:26px 26px 0 0;padding:8px 16px calc(var(--sab) + 16px);transform:translate3d(0,100%,0);transition:transform .28s var(--ease);max-height:92vh;overflow:auto;overscroll-behavior:contain;will-change:transform}
.sheet-ov.show .sheet{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--soft);opacity:.5;margin:2px auto 14px}
.sheet h3{font-size:20px;font-weight:700;margin:0 4px 10px}
.sheet .sp{color:var(--muted);font-size:15px;line-height:1.5;margin:0 4px 14px}
.row2{display:flex;gap:10px;margin-top:16px}
.qr{position:relative;background:#fff;border-radius:22px;padding:14px;width:min(260px,70vw);margin:6px auto 14px}
.qr svg{display:block;width:100%;height:auto}
.qrl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:50%;padding:4px;line-height:0}.qrl .lg{width:46px;height:46px}
.addr{background:var(--card);border-radius:16px;padding:12px 14px;font-size:14px;word-break:break-all;text-align:center;user-select:text;-webkit-user-select:text;line-height:1.5}
.tokprev{min-height:24px;margin-top:12px;font-size:14px}.tokprev .ar{background:var(--card);border-radius:16px}.tokprev .err{color:var(--dn)}.tokprev .mute{color:var(--muted)}
.icp{display:flex;gap:8px}.icp button{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font:900 18px KwBlack,system-ui;border:2px solid transparent}
.icp button[data-i="lime"]{background:#ddf869;color:#223348}.icp button[data-i="navy"]{background:#223348;color:#ddf869}
.icp button.on{border-color:var(--text)}
.pick1{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;font-size:16px}
.pick1:active{background:var(--card2)}.pick1 .ic{margin-left:auto;color:var(--up)}
.lic{font-size:13.5px;line-height:1.55;color:var(--muted);white-space:pre-wrap;user-select:text;-webkit-user-select:text}
/* ---------- bottom nav (Gem) ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navbg);border-top:1px solid var(--line);padding:8px 8px calc(var(--sab) + 8px);display:flex;justify-content:space-around;transform:translate3d(0,0,0);transition:transform .25s var(--ease),background-color .25s ease}
.nav.hide{transform:translate3d(0,110%,0)}
.nav button{text-align:center;flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:2px 0;color:var(--muted);font-size:13.5px;font-weight:600}
.nav .ni{width:64px;height:32px;border-radius:999px;display:grid;place-items:center;transition:background-color .2s ease}
.nav button.on{color:var(--text)}
.nav button.on .ni{background:var(--sel)}
.nav .hmk{width:24px;height:24px;border-radius:7px;background:#DDF869;color:#223348;display:grid;place-items:center;font:900 15px/1 KwBlack,RobotoE,system-ui;box-shadow:inset 0 -2px 0 rgba(34,51,72,.14)}
.nav button:not(.on) .hmk{filter:saturate(.35) brightness(.92);opacity:.85}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],
      [6, 26, 50, 74],
      [6, 30, 54, 78],
      [6, 30, 56, 82],
      [6, 30, 58, 86],
      [6, 34, 62, 90],
      [6, 28, 50, 72, 94],
