  :root, [data-theme="dark"] {
    --bg: #0e1117;
    --bg-card: #151b25;
    --bg-input: #1d2532;
    --border: #2a3446;
    --text: #d9e2ef;
    --text-muted: #8494ab;
    --accent: #DDF869;
    --accent-hover: #e9ff96;
    --danger: #f2665e;
    --greyed: #5f6c85;
    --row-hover: #1e2839;
    --btn-addr-bg: #1a7a42;
    --btn-pk-bg: #cf3f36;
  }
  [data-theme="light"] {
    --bg: #f8f9fa;
    --bg-card: #fff;
    --bg-input: #f1f3f4;
    --border: #dadce0;
    --text: #202124;
    --text-muted: #5f6368;
    --accent: #1a73e8;
    --accent-hover: #1765cc;
    --danger: #d93025;
    --greyed: #80868b;
    --row-hover: #f1f3f4;
    --btn-addr-bg: #188038;
    --btn-pk-bg: #d93025;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'RobotoE', Roboto, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    height: 100%;
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 8px 10px;
    gap: 6px;
  }

  /* Top bar */
  .top {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    flex-wrap: nowrap;
  }
  .top h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .3px;
    flex: 1 1 auto;
    min-width: 46px;
    white-space: nowrap;
  }
  .net {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .net button {
    border: none;
    background: transparent;
    color: var(--text-muted);
    padding: 5px 8px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
  }
  .net button.on { background: var(--accent); color: #fff; }
  [data-theme="dark"] .net button.on { color: #223348; }
  .top-select {
    height: 26px;
    padding: 0 6px;
    font-size: 11px;
    font-weight: 600;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
  }
  .net button { height: 26px; padding: 5px 6px; }
  .icon-btn { height: 26px; padding: 5px 6px; }
  @media (max-width: 380px) {
    .top { overflow-x: auto; scrollbar-width: none; }
    .top::-webkit-scrollbar { display: none; }
  }
  .icon-btn {
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-muted);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    cursor: pointer;
  }

  /* Controls panel */
  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;

    transition: opacity .24s ease, transform .24s cubic-bezier(.3,.7,.2,1), visibility 0s linear 0s; animation: none !important; }
  #backup-modal .bk-stack > * > :last-child { margin-top: auto; }
  #backup-modal .bk-stack > [hidden] { visibility: hidden; opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s; }
  .bk-tab { font-weight: 600 !important; }


  /* ===== v3.41 Settings (Material 3 style) ===== */
  .top #settings-btn.tb-ic { width: 44px !important; min-width: 44px !important; }
  .top #settings-btn .tl { letter-spacing: -.02em; font-size: .92em; }
  .kws-ov { position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,.32); display: flex; align-items: center; justify-content: center; padding: 24px;
    opacity: 0; pointer-events: none; transition: opacity .18s ease; }
  .kws-ov.show { opacity: 1; pointer-events: auto; }
  .kws { width: min(420px, 100%); max-height: 86dvh; overflow-y: auto; background: var(--bg-card); color: var(--text); border-radius: 28px; padding: 8px 0 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,.28); transform: scale(.96); transition: transform .22s cubic-bezier(.2,0,0,1); font-family: 'RobotoE','Roboto',system-ui,sans-serif; }
  .kws-ov.show .kws { transform: none; }
  .kws-don { margin: 4px 16px 8px; padding: 14px 8px 8px; border-radius: 20px; background: #DDF869; color: #223348; }
  .kws-don-h { display: flex; align-items: baseline; gap: 8px; padding: 0 10px 8px; font: 400 13px/18px 'RobotoE','Roboto',system-ui,sans-serif; }
  .kws-don-h b { font: 500 16px/22px 'RobotoE','Roboto',system-ui,sans-serif; }
  .kws-don-h span { opacity: .7; }
  .kws-don-r { display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0 6px 0 10px; border: 0; border-radius: 12px; background: transparent; color: inherit; cursor: pointer; text-align: left; transition: background .15s ease, transform .1s ease; }
  .kws-don-r:active { background: rgba(34,51,72,.12); transform: scale(.99); }
  .kws-don-b { flex: 0 0 38px; font: 700 10.5px/20px 'RobotoE','Roboto',system-ui,sans-serif; letter-spacing: .3px; text-align: center; border-radius: 6px; background: #223348; color: #DDF869; }
  .kws-don-a { flex: 1; min-width: 0; font: 400 13px/18px 'RobotoMonoE','Roboto Mono',ui-monospace,monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kws-don-c { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; }
  .kws-don-c svg { width: 20px; height: 20px; fill: #223348; }
  .kws-don-r.ok .kws-don-c { background: #223348; } .kws-don-r.ok .kws-don-c svg { fill: #DDF869; }
  .kws-head { display: flex; align-items: center; height: 56px; padding: 0 8px 0 24px; }
  .kws-head h2 { flex: 1; margin: 0; font: 400 22px/28px 'RobotoE','Roboto',system-ui,sans-serif; color: var(--text); }
  .kws-x { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; color: var(--text-muted); display: grid; place-items: center; cursor: pointer; }
  .kws-x:active, .kws-row:active { background: color-mix(in srgb, var(--text) 10%, transparent); }
  .kws svg { width: 24px; height: 24px; fill: currentColor; }
  .kws-sec { padding: 16px 24px 4px; font: 500 14px/20px 'RobotoE','Roboto',system-ui,sans-serif; color: var(--accent); }
  .kws-row { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 64px; padding: 8px 24px; border: 0; background: transparent; color: var(--text);
    text-align: left; cursor: pointer; font: 400 16px/24px 'RobotoE','Roboto',system-ui,sans-serif; }
  .kws-row .kws-ic { color: var(--text-muted); display: grid; place-items: center; flex: 0 0 24px; }
  .kws-row .kws-t { flex: 1; min-width: 0; }
  .kws-row .kws-s { display: block; font-size: 14px; line-height: 20px; color: var(--text-muted); }
  .kws-row:disabled { opacity: .38; cursor: default; }
  .kws-sw { flex: 0 0 52px; height: 32px; border-radius: 16px; border: 2px solid var(--text-muted); position: relative; transition: background-color .2s, border-color .2s; }
  .kws-sw::after { content: ''; position: absolute; top: 6px; left: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--text-muted); transition: all .2s cubic-bezier(.2,0,0,1); }
  .kws-row.on .kws-sw { background: var(--accent); border-color: var(--accent); }
  .kws-row.on .kws-sw::after { left: 22px; top: 2px; width: 24px; height: 24px; background: var(--bg-card); }
  /* choice dialog */
  .kwd-ov { position: fixed; inset: 0; z-index: 9100; background: rgba(0,0,0,.32); display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .kwd-ov.show { opacity: 1; pointer-events: auto; }
  .kwd { width: min(312px, 100%); background: var(--bg-card); color: var(--text); border-radius: 28px; padding: 24px 0 16px; font-family: 'RobotoE','Roboto',system-ui,sans-serif; box-shadow: 0 8px 28px rgba(0,0,0,.3); }
  .kwd-p { margin: 0 24px 8px; font: 400 14px/20px 'RobotoE','Roboto',system-ui,sans-serif; opacity: .78; }
  .kwd h3 { margin: 0 24px 12px; font: 400 24px/32px 'RobotoE','Roboto',system-ui,sans-serif; }
  .kwd-opt { display: flex; align-items: center; gap: 16px; width: 100%; height: 48px; padding: 0 24px; border: 0; background: transparent; color: var(--text); font: 400 16px/24px 'RobotoE','Roboto',system-ui,sans-serif; cursor: pointer; text-align: left; }
  .kwd-opt:active { background: color-mix(in srgb, var(--text) 10%, transparent); }
  .kwd-r { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--text-muted); display: grid; place-items: center; flex: 0 0 auto; }
  .kwd-r::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .15s; }
  .kwd-opt.on .kwd-r { border-color: var(--accent); }
  .kwd-opt.on .kwd-r::after { transform: scale(1); }
  .kwd-act { display: flex; justify-content: flex-end; padding: 12px 24px 0; }
  .kwd-act button { height: 40px; padding: 0 12px; border: 0; border-radius: 20px; background: transparent; color: var(--accent); font: 500 14px/20px 'RobotoE','Roboto',system-ui,sans-serif; cursor: pointer; }
  .kwd-act button:active { background: color-mix(in srgb, var(--accent) 12%, transparent); }

#kl-root {
  --kl-lime: #DDF869; --kl-lime-deep: #CFEA55; --kl-ink: #223348;
  --kl-k: clamp(88px, 27vw, 210px);
  --kl-ease: cubic-bezier(.22, 1, .36, 1);
  position: fixed; inset: 0; z-index: 100000; overflow: hidden;
  background: var(--kl-lime); color: var(--kl-ink);
  font-family: 'KwBlack', 'Roboto', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
  transition: opacity .45s ease, transform .45s var(--kl-ease);
}
#kl-root.kl-out { opacity: 0; transform: scale(1.04); pointer-events: none; }
#kl-root * { box-sizing: border-box; margin: 0; padding: 0; }
#kl-root .kl-aura { position: absolute; left: 50%; top: 47%; width: 150vmin; height: 150vmin; pointer-events: none;
  transform: translate(-50%, -50%) scale(.9); border-radius: 50%; opacity: 0;
  background: radial-gradient(closest-side, rgba(255,255,255,.55), rgba(255,255,255,.18) 45%, rgba(255,255,255,0) 72%);
  animation: klAuraIn 1.4s var(--kl-ease) .2s forwards, klAura 5.5s ease-in-out 1.6s infinite; }
@keyframes klAuraIn { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes klAura { 0%,100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 50% { transform: translate(-50%, -50%) scale(1.06); opacity: .75; } }
#kl-root.kl-pin .kl-aura { top: 9%; opacity: .7; transition: top .7s var(--kl-ease); }
#kl-root .kl-bg { position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(110% 70% at 50% -5%, rgba(255,255,255,.38), rgba(255,255,255,0) 60%),
    radial-gradient(120% 80% at 50% 108%, var(--kl-lime-deep), rgba(221,248,105,0) 62%); }

/* chain marks */
#kl-root .kl-coins { position: absolute; inset: 0; pointer-events: none; }
#kl-root .kl-coin { position: absolute; left: 0; top: 0; width: 44px; height: 44px; opacity: 0;
  color: var(--kl-ink); will-change: transform, opacity; }
#kl-root .kl-coin svg { width: 100%; height: 100%; display: block; fill: currentColor; }
#kl-root .kl-coin .kl-cd { fill: var(--kl-disc, var(--kl-ink)); stroke: none; }
#kl-root .kl-coin.kl-lit, #kl-root .kl-ring .kl-disc { filter: none !important; }
#kl-root .kl-coin.kl-lit { color: color-mix(in srgb, var(--kl-ink) 92%, var(--kl-lime)); }

/* wordmark */
#kl-root .kl-brandwrap { position: absolute; left: 0; right: 0; top: 50%; display: flex; justify-content: center;
  transform: translateY(-58%); }
#kl-root .kl-brand { position: relative; display: inline-flex; align-items: baseline; line-height: 1; font-weight: 900;
  white-space: nowrap; transform-origin: 50% 50%; }
#kl-root .kl-brand::after { content: ''; position: absolute; top: -18%; bottom: -18%; left: 0; width: 38%; z-index: 3; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.6) 50%, transparent); mix-blend-mode: soft-light;
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(180deg, transparent, #000 22%, #000 78%, transparent);
  transform: translateX(-160%) skewX(-18deg); animation: klShine 1.5s ease 1.2s 1 both; }
#kl-root .kl-brand.kl-noshine::after { animation: none; opacity: 0; }
@keyframes klShine { to { transform: translateX(340%) skewX(-18deg); } }
#kl-root .kl-k { position: relative; z-index: 2; display: inline-block; font-size: var(--kl-k); color: var(--kl-ink); top: calc(var(--kl-k) * .038);
  letter-spacing: calc(var(--kl-k) * -0.035); transform-origin: 50% 55%; text-rendering: geometricPrecision; backface-visibility: hidden;
  opacity: 0; animation: klKIn .8s var(--kl-ease) .1s forwards; }
#kl-root .kl-w { position: relative; z-index: 1; display: inline-block; font-size: calc(var(--kl-k) * .9); color: #fff;
  letter-spacing: calc(var(--kl-k) * .012); margin-left: calc(var(--kl-k) * -0.02);
  -webkit-text-stroke: calc(var(--kl-k) * .085) var(--kl-ink); paint-order: stroke fill;
  text-shadow: calc(var(--kl-k) * .012) calc(var(--kl-k) * .05) 0 var(--kl-ink);
  text-rendering: geometricPrecision; opacity: 0; animation: klWIn .85s var(--kl-ease) .26s forwards; }
@keyframes klKIn { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

        if (rc.status === '0x1') { try { FX.notify('addr'); } catch (e) {} toast('Confirmed on ' + n.name); } else toast('Transaction failed on ' + n.name);

  /* ---------- Kwallet bridge ---------- */
  var SIGN = null;

  function sign(req) { return new Promise(function (res) { SIGN = res; try { HwNative.sign(JSON.stringify(req)); } catch (e) { SIGN = null; res({ status: 'missing' }); } }); }
  function pairNative() {
    if (!(window.HwNative && HwNative.sign)) { toast('Pairing works in the Hwallet app with Kwallet on the same phone'); return; }
    var now = Date.now();
    sign({ v: 1, id: rid(16), action: 'pair', created: now, expires: now + 120000 }).then(function (o) {
      if (o && o.status === 'paired' && o.pair) { applyPair(o.pair); return; }

  function applyPair(p) {

    var ok = { eth: /^0x[0-9a-fA-F]{40}$/, sol: /^[1-9A-HJ-NP-Za-km-z]{32,44}$/, btc: /^(bc1|[13])[a-zA-HJ-NP-Z0-9]{25,62}$/, trx: /^T[1-9A-HJ-NP-Za-km-z]{33}$/, sui: /^0x[0-9a-f]{64}$/, xrp: /^r[1-9A-HJ-NP-Za-km-z]{24,34}$/, ada: /^addr1[0-9a-z]{50,120}$/, xmr: /^[48][1-9A-HJ-NP-Za-km-z]{94}$/ };

  /* ---------- setup ---------- */

  /* ---------- receive ---------- */

  /* ---------- add token ---------- */
  function addToken() {
    var ch = V.ch, net = V.net, ov = document.createElement('div'); ov.className = 'modal-overlay show';

      '<input type="text" id="hw-ta" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Contract"><p class="hw-why" id="hw-tam"></p>' +
      '<div class="mrow"><button class="btn" type="button" aria-label="Close" data-x>Cancel</button><button class="btn btn-p" type="button" data-ok>Add</button></div></div>';
    document.body.appendChild(ov);

        if (!/^0x[0-9a-fA-F]{40}$/.test(a)) { msg.textContent = 'Not a valid contract address'; return; }
        p = batch(EVMBY[net].rpc, [['eth_call', [{ to: a, data: '0x95d89b41' }, 'latest']], ['eth_call', [{ to: a, data: '0x313ce567' }, 'latest']]]).then(function (r) {
          var d = Number(hexU(r[1].result)), hx = (r[0].result || '0x').slice(2), s = '';

      }
      p.then(function (t) { list.push(t); jset('hw-tokens', TOK); close(); toast(t.s + ' added'); fetchChain(ch).then(function () { saveCache(); render(); }); render(); }, function () { msg.textContent = 'Could not read this token on the network'; });
    });
  }

  /* ---------- binding ---------- */
  function bindMain() {

  }

  /* ---------- refresh loop: visible screen only, paused in the background ---------- */

  /* ---------- Android back ---------- */
  window.kwBack = function () {
    var open = Array.prototype.filter.call(document.querySelectorAll('.show'), function (e) { return !/toast/i.test(e.id + ' ' + e.className) && getComputedStyle(e).position === 'fixed'; });
    if (open.length) { var top = open[open.length - 1], x = top.querySelector('.kws-x, [aria-label="Close"], [data-close]'); if (x) x.click(); else top.classList.remove('show'); return true; }

  };

  /* ---------- settings hooks ---------- */
  window.HW = {
    setup: function () { go({ v: 'setup' }); }, pair: pairNative,
    refreshEvery: function () { return +jget('hw-refresh', 20) || 20; }, setRefresh: function (s) { jset('hw-refresh', +s); loop(); },
    summary: function () { var n = CH.filter(function (c) { return A[c.id]; }).length, p = A.paired ? Object.keys(A.paired).length : 0; return n ? n + ' chains · ' + (p ? 'paired with Kwallet' : 'watch only') : 'None yet'; },
    _t: { fmtU: fmtU, parseUnits: parseUnits, applyPair: applyPair, state: function () { return { A: A, C: C, V: V }; } }
  };

  /* ---------- start ---------- */
  var started = false;
  function start() {
    if (started) return; started = true;
    loadAll(); initTop();
    if (!hasAny()) { V = { v: 'setup' }; stack = []; render(true); }
    else { render(true); refreshAll(); }

  }

    try { NETIC = JSON.parse(document.getElementById('hw-neticons').textContent); } catch (e) {}

  }

})();
