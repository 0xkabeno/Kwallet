<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob: https:; font-src data:; connect-src https: wss:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none';">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Hwallet</title>
<style>
:root{--sat:0px;--sab:0px}
body[data-theme="light"]{--bg:#f4f5f7;--card:#ffffff;--card2:#eef0f3;--line:#e9ebef;--text:#14171a;--muted:#6b7079;--soft:#9aa0a8;--acc:#223348;--accI:#ffffff;--accT:#223348;--up:#16a05a;--dn:#e5484d;--warn:#b26b00;--warnBg:#fff4e0;--errBg:#fdecec}
body[data-theme="dark"]{--bg:#17181b;--card:#232429;--card2:#2c2e33;--line:#2f3136;--text:#eceef1;--muted:#9a9ea6;--soft:#71757d;--acc:#ddf869;--accI:#223348;--accT:#ddf869;--up:#34c77b;--dn:#ff6a6a;--warn:#f0c14b;--warnBg:#3a321d;--errBg:#3a2224}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;overscroll-behavior:none}
body{min-height:100vh;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.app{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 4px) 16px calc(var(--sab) + 28px)}
.app.in{animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.ic{width:24px;height:24px;display:block}.ic.sm{width:20px;height:20px}
.mono{font-family:"Roboto Mono",ui-monospace,Menlo,monospace;letter-spacing:.2px}
.bar{display:flex;align-items:center;height:56px;gap:8px}
.ib,.ib0{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;color:var(--text)}
.ib:active{background:var(--card2)}
.bt{flex:1;text-align:center;font-size:20px;font-weight:500;display:flex;justify-content:center;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl{display:inline-flex;align-items:center;gap:9px;font-size:20px;font-weight:500;padding:6px 8px;border-radius:12px}
.hpill{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#ddf869;color:#223348;font:900 18px/1 system-ui;letter-spacing:-.5px}
.hero{text-align:center;padding:10px 0 4px}
.tot{font-size:46px;font-weight:700;letter-spacing:-1px;line-height:1.15;font-variant-numeric:tabular-nums}
.acts{display:flex;justify-content:center;gap:44px;margin:22px 0 26px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:64px}
.ac{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--accI);display:grid;place-items:center;transition:transform .12s}
.act:active .ac{transform:scale(.94)}
.act[data-off] .ac{opacity:.38}
.al{font-size:15px;color:var(--muted);font-weight:500}
.grp{background:var(--card);border-radius:20px;overflow:hidden;margin-bottom:14px}
.list .row+.row,.list .row+.add{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:12px 16px}
.row:active{background:var(--card2)}.row.static:active{background:none}
.row.sm{min-height:64px}
.lg{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:#fff;display:inline-block}
body[data-theme="light"] img.lg{box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.lg.big{width:72px;height:72px}.lg.xs{width:22px;height:22px}
.row.sm .lg{width:40px;height:40px}
.lt{display:inline-grid;place-items:center;background:var(--card2);color:var(--muted);font-weight:700;font-size:18px}
.lt .ic{width:22px;height:22px}.lt.bad{color:var(--dn)}.lt.pl{color:var(--accT)}
.lgw{position:relative;overflow:hidden;background:var(--card2)}.lgw .in{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:18px}.lgw img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;background:#fff}
.lg.big.lt,.lg.big.lgw .in{font-size:28px}
.rm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rn{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.rp{font-size:14.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{font-size:17px;font-weight:500;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rb.mute{color:var(--soft);font-weight:400;font-size:15px}
.rr{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.ru{font-size:14px;color:var(--muted);white-space:nowrap}
.up{color:var(--up)}.dn{color:var(--dn)}
.ic.ok{width:18px;height:18px;color:var(--up)}
.foot,.sub{color:var(--muted);font-size:14px;text-align:center;margin:6px 8px 14px;line-height:1.45}
.sub{text-align:left;margin:0 4px 12px}
.chero{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 0}
.chero .lg{margin-bottom:12px}
.cam{font-size:40px;font-weight:700;letter-spacing:-.8px;text-align:center;line-height:1.15;word-break:break-word;font-variant-numeric:tabular-nums}
.cus{font-size:16px;color:var(--muted);min-height:20px}
.why{color:var(--muted);font-size:14px;line-height:1.45;text-align:center;margin:-10px 12px 18px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:58px;padding:12px 16px;font-size:16.5px}
.grp .kv+.kv{border-top:1px solid var(--line)}
.kv>span:first-child{flex:0 0 auto}
.kv>span:last-child{color:var(--muted);text-align:right;display:flex;align-items:center;gap:6px;min-width:0}
.kv.tap:active{background:var(--card2)}
.kvn{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.ic.chev{width:20px;height:20px;color:var(--soft)}
.sec{font-size:15px;color:var(--muted);font-weight:500;margin:20px 4px 8px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:34px 20px 10px}
.eb{width:96px;height:96px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--text);margin-bottom:12px}.eb .ic{width:40px;height:40px}
.empty b{font-size:18px;font-weight:600}.empty span{color:var(--muted);font-size:15px}
.st-ok{color:var(--up)}.st-fail{color:var(--dn)}.st-pending{color:var(--warn)}
.link{display:block;margin:4px auto 14px;font-size:15px;font-weight:500;color:var(--muted);padding:10px}.link.danger{color:var(--dn)}
.add .rn{color:var(--accT)}body[data-theme="light"] .add .rn{color:var(--acc)}
/* forms */
.form,.setup{padding-top:6px}
.setup h2{font-size:26px;font-weight:700;margin:10px 0 6px}
.sp{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:16px}
.lbl{font-size:14px;color:var(--muted);font-weight:500;margin:16px 4px 8px}
.inp{display:flex;align-items:center;background:var(--card);border-radius:16px;padding:4px 6px 4px 14px;min-height:56px;border:1px solid transparent}
.inp:focus-within{border-color:var(--soft)}
.inp input,.inp textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16.5px;padding:10px 0}
.inp textarea{resize:none;font-family:"Roboto Mono",ui-monospace,monospace;font-size:14px}
.pb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--accT);flex:0 0 auto}body[data-theme="light"] .pb{color:var(--acc)}
.pb:active{background:var(--card2)}
.amt .sym{color:var(--muted);font-weight:500;margin:0 8px}
.mx{font-weight:600;font-size:14px;background:var(--card2);border-radius:999px;padding:8px 14px;margin-right:4px}
.hint2{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13.5px;margin:8px 6px 0}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:42px;border-radius:11px;font-weight:500;color:var(--muted);text-align:center}
.seg button.on{background:var(--acc);color:var(--accI)}
.seg.sm{background:var(--card2);border-radius:999px}.seg.sm button{height:32px;padding:0 12px;border-radius:999px;font-size:14px;flex:0 0 auto}
.seg button[hidden]{display:none}
.note{background:var(--card);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;color:var(--muted);margin-top:10px}
.note.warn{background:var(--errBg);color:var(--dn)}
.note[hidden]{display:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:999px;background:var(--card);font-weight:600;font-size:16px;padding:0 20px;flex:1;text-align:center}
.btn .ic{width:20px;height:20px}
.btn.pri{background:var(--acc);color:var(--accI)}
.btn.wide{width:100%;margin-top:14px}.btn.big{height:56px;margin-top:24px}
.btn:disabled{opacity:.4}
.btn:active:not(:disabled){filter:brightness(.95)}
.hint{color:var(--muted);font-size:13.5px;line-height:1.45;text-align:center;margin:10px 8px 0}
.man{margin-top:22px;background:var(--card);border-radius:18px;padding:4px 14px 14px}
.man summary{font-weight:500;padding:14px 0 8px;color:var(--muted);cursor:pointer}
.man .inp{background:var(--bg)}
/* sheets */
.sheet-ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;transition:background .2s}
.sheet-ov.show{background:rgba(0,0,0,.45)}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 18px calc(var(--sab) + 18px);transform:translateY(100%);transition:transform .24s cubic-bezier(.22,1,.36,1);max-height:92vh;overflow:auto}
.sheet-ov.show .sheet{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--soft);opacity:.5;margin:2px auto 14px}
.sheet h3{font-size:20px;font-weight:600;margin-bottom:8px}
.row2{display:flex;gap:10px;margin-top:16px}
.qr{position:relative;background:#fff;border-radius:20px;padding:14px;width:min(270px,72vw);margin:6px auto 14px}
.qr svg{display:block;width:100%;height:auto}
.qrl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:50%;padding:4px;line-height:0}.qrl .lg{width:46px;height:46px}
.addr{background:var(--card);border-radius:14px;padding:12px 14px;font-size:14px;word-break:break-all;text-align:center;user-select:text;-webkit-user-select:text}
.tokprev{min-height:24px;margin-top:12px;font-size:14px}.tokprev .row{background:var(--card);border-radius:16px}.tokprev .err{color:var(--dn)}.tokprev .mute{color:var(--muted)}
.set .kv{font-size:16px}
.icp{display:flex;gap:8px}.icp button{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font:900 18px system-ui;border:2px solid transparent}
.icp button[data-i="lime"]{background:#ddf869;color:#223348}.icp button[data-i="navy"]{background:#223348;color:#ddf869}
.icp button.on{border-color:var(--text)}
.ver{color:var(--soft);font-size:13px;text-align:center;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 24px);transform:translate(-50%,20px);background:#1f2125;color:#fff;padding:12px 18px;border-radius:14px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:88vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
body[data-theme="dark"] .toast{background:#f1f2f4;color:#17181b}
.toast.show{opacity:1;transform:translate(-50%,0)}

</style>
</head>

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

        throw count + ' != ' + numChars;
      }

      return unicodeMap;

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }

    if (ch === 'ada') return race(CHBY.ada.rest, function (u) { return http(u + '/submittx', { method: 'POST', body: res.raw, ctype: 'application/cbor;hex', text: true, timeout: 12000 }); }).then(function (t) { return String(t).replace(/"/g, '').trim() || res.hash; });
    return Promise.reject(new Error('unsupported'));
  }
  function setSt(hash, st) { var x = ACT.filter(function (a) { return a.hash === hash; })[0]; if (x && x.st !== st) { x.st = st; jset('hw-acts', ACT); if (V.v === 'coin') render(); } }
  function watchTx(ch, net, hash, k) {
    k = k || 0; if (!hash || k > 90) return;
    setTimeout(function () {
      var p;
      if (ch === 'eth') p = rpc(EVMBY[net].rpc, 'eth_getTransactionReceipt', [hash]).then(function (r) { return r ? (r.status === '0x1' ? 'ok' : 'fail') : null; });
      else if (ch === 'sol') p = rpc(CHBY.sol.rpc, 'getSignatureStatuses', [[hash], { searchTransactionHistory: true }]).then(function (r) { var s = r && r.value && r.value[0]; return s ? (s.err ? 'fail' : (s.confirmationStatus === 'confirmed' || s.confirmationStatus === 'finalized') ? 'ok' : null) : null; });
      else if (ch === 'btc') p = race(CHBY.btc.rest, function (u) { return http(u + '/tx/' + hash + '/status'); }).then(function (j) { return j && j.confirmed ? 'ok' : null; });
      else if (ch === 'trx') p = tron('/wallet/gettransactioninfobyid', { value: hash }).then(function (j) { if (!j || !j.id) return null; return j.receipt && j.receipt.result && j.receipt.result !== 'SUCCESS' ? 'fail' : 'ok'; });
      else if (ch === 'sui') p = rpc(CHBY.sui.rpc, 'sui_getTransactionBlock', [hash, { showEffects: true }]).then(function (r) { var s = r && r.effects && r.effects.status; return s ? (s.status === 'success' ? 'ok' : 'fail') : null; });
      else if (ch === 'xrp') p = xrpc('tx', { transaction: hash }).then(function (r) { return r.validated ? (r.meta && r.meta.TransactionResult === 'tesSUCCESS' ? 'ok' : 'fail') : null; });
      else if (ch === 'ada') p = koios('/tx_status', { _tx_hashes: [hash] }).then(function (j) { var s = (j || [])[0]; return s && s.num_confirmations > 0 ? 'ok' : null; });
      p.then(function (st) {
        if (!st) { watchTx(ch, net, hash, k + 1); return; }
        setSt(hash, st); buzz(st === 'ok' ? [10, 40, 10] : [30, 40, 30]); toast(st === 'ok' ? 'Confirmed' : 'Transaction failed');
        refreshChain(ch);
      }, function () { watchTx(ch, net, hash, k + 1); });
    }, k < 10 ? 2500 : ch === 'btc' ? 30000 : 6000);
  }

  /* ---------- settings ---------- */
  function openSettings() {
    var th = document.body.getAttribute('data-theme'), icon = 'lime'; try { if (window.HarkNative && HarkNative.appIcon) icon = String(HarkNative.appIcon()); } catch (e) {}
    var rs = +jget('hw-refresh', 20) || 20;
    sheet('<h3>Settings</h3><div class="grp set">' +
      '<div class="kv"><span>Theme</span><span class="seg sm" id="st-th"><button data-th="light" class="' + (th !== 'dark' ? 'on' : '') + '">Light</button><button data-th="dark" class="' + (th === 'dark' ? 'on' : '') + '">Dark</button></span></div>' +
      (window.HarkNative && HarkNative.setAppIcon ? '<div class="kv"><span>App icon</span><span class="icp" id="st-ic"><button data-i="lime" class="' + (icon !== 'navy' ? 'on' : '') + '" aria-label="Lime"><b>H</b></button><button data-i="navy" class="' + (icon === 'navy' ? 'on' : '') + '" aria-label="Navy"><b>H</b></button></span></div>' : '') +
      '<div class="kv"><span>Refresh on screen</span><span class="seg sm" id="st-rf">' + [10, 20, 60].map(function (s) { return '<button data-rf="' + s + '" class="' + (s === rs ? 'on' : '') + '">' + (s < 60 ? s + 's' : '1 min') + '</button>'; }).join('') + '</span></div>' +
      '<button class="kv tap" data-s="wallet"><span>Wallet and addresses</span><span class="kvn">' + esc(A.label || 'Set up') + sv('chev', 'ic chev') + '</span></button>' +
      (window.HwNative && HwNative.sign ? '<button class="kv tap" data-s="pair"><span>Pair with Kwallet</span><span class="kvn">' + sv('chev', 'ic chev') + '</span></button>' : '') +
      '</div><p class="ver">Hwallet ' + APP_VERSION + ' · Watch only. Keys stay in Kwallet.</p><div class="row2"><button class="btn" data-x>Done</button></div>', function (ov, close) {
      ov.querySelectorAll('[data-th]').forEach(function (b) { b.onclick = function () { setTheme(b.getAttribute('data-th')); ov.querySelectorAll('[data-th]').forEach(function (x) { x.classList.toggle('on', x === b); }); buzz(6); }; });
      ov.querySelectorAll('[data-i]').forEach(function (b) { b.onclick = function () { try { if (HarkNative.setAppIcon(b.getAttribute('data-i'))) { ov.querySelectorAll('[data-i]').forEach(function (x) { x.classList.toggle('on', x === b); }); toast('App icon changed'); } } catch (e) {} }; });
      ov.querySelectorAll('[data-rf]').forEach(function (b) { b.onclick = function () { jset('hw-refresh', +b.getAttribute('data-rf')); ov.querySelectorAll('[data-rf]').forEach(function (x) { x.classList.toggle('on', x === b); }); loop(); buzz(6); }; });
      ov.querySelectorAll('[data-s]').forEach(function (b) { b.onclick = function () { close(); if (b.getAttribute('data-s') === 'pair') pairNative(); else go({ v: 'setup' }); }; });
    });
  }
  function setTheme(t) {
    document.body.setAttribute('data-theme', t); try { localStorage.setItem('wallet-theme', t); } catch (e) {}
    try { if (window.HarkNative && HarkNative.setDark) HarkNative.setDark(t === 'dark'); } catch (e) {} paintBars();
  }
  function paintBars() { try { var c = getComputedStyle(document.body).getPropertyValue('--bg').trim(); if (window.HarkNative && HarkNative.setBars && c) HarkNative.setBars(c, c); } catch (e) {} }
  window.kwInsets = function (o) { var s = document.documentElement.style; s.setProperty('--sat', (o.t || 0) + 'px'); s.setProperty('--sab', (o.b || 0) + 'px'); };

  /* ---------- refresh loop: silent, visible screen only, paused in the background ---------- */
  var busyR = {};
  function refreshChain(id) {
    if (busyR[id] || !A[id]) return busyR[id] || Promise.resolve();
    busyR[id] = fetchChain(id).then(function () { saveCache(); }, function () {}).then(function () { busyR[id] = null; update(); });
    return busyR[id];
  }
  function refreshAll() { return Promise.all([fetchPrices().then(update, function () {})].concat(CH.map(function (c) { return refreshChain(c.id); }))); }
  function refreshVisible(force) {
    if (V.v === 'home' || V.v === 'setup' || V.v === 'pick') return refreshAll();
    if (V.v === 'send') return Promise.resolve();
    var ps = [refreshChain(V.ch)]; if (force || Date.now() - C.pt > 60000) ps.push(fetchPrices().then(update, function () {}));
    return Promise.all(ps);
  }
  var loopT = 0;
  function loop() {
    clearTimeout(loopT);
    var sec = +jget('hw-refresh', 20) || 20;
    loopT = setTimeout(function () { if (document.visibilityState === 'visible' && started && !LIVE) refreshVisible().then(loop, loop); else loop(); }, sec * 1000);
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && started && !LIVE) { refreshVisible(); loop(); } });

  /* ---------- Android back ---------- */
  window.kwBack = function () {
    var ov = document.querySelectorAll('.sheet-ov.show'); if (ov.length) { ov[ov.length - 1]._close(); return true; }
    if (V.v === 'setup' && !hasAny()) return false;
    if (V.v !== 'home') { if (!back()) { V = { v: 'home' }; render(true); } return true; }
    return false;
  };

  window.HW = { _t: { fetchChain: fetchChain, batch: batch, fmtU: fmtU, parseUnits: parseUnits, applyPair: applyPair, keccak: keccak, checksum: checksum, pda: pda, tokenMeta: tokenMeta, state: function () { return { A: A, C: C, V: V, SND: SND }; }, go: go, render: render, update: update, PREP: PREP } };

  /* ---------- start: no lock screen; straight to home ---------- */
  var started = false;
  function start() {
    if (started) return; started = true;
    try { LOGO = JSON.parse($('hw-logos').textContent); } catch (e) {}
    var th = 'light'; try { th = localStorage.getItem('wallet-theme') || 'light'; } catch (e) {} document.body.setAttribute('data-theme', th);
    if (jget('hw-hide', false)) document.body.classList.add('hw-hide');
    loadAll();
    /* v1.0 with its App lock on kept the addresses encrypted; v1.1 has no lock, so that copy is unreadable: pair again */
    try { if (!hasAny() && localStorage.getItem('kw-vault-data')) { ['kw-vault-v1', 'kw-vault-data', 'kw-vault-data-prev', 'kw-pin-v1', 'kw-pin-mode', 'kw-bio', 'kw-pin-kind'].forEach(function (k) { localStorage.removeItem(k); }); setTimeout(function () { toast('Hwallet no longer has its own lock. Pair with Kwallet again'); }, 800); } } catch (e) {}
    try { if (window.HarkNative && HarkNative.insets) window.kwInsets(JSON.parse(HarkNative.insets())); } catch (e) {}
    if (!hasAny()) { V = { v: 'setup' }; stack = []; render(true); }
    else { render(true); refreshAll(); }
    loop();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
