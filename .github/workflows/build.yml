name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read version
        id: ver
        run: |
          V=$(grep -oP "const APP_VERSION = '\K[0-9.]+" web/index.html | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Kwallet v$V"

      - name: Release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kwallet.jks"
            echo "KW_KEYSTORE=$RUNNER_TEMP/kwallet.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore"
          else
            echo "::warning::No KEYSTORE_BASE64 secret - APK is signed with a temporary debug key"
          fi

      - name: Build
        env:
          KW_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Package
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Kwallet-v$V.apk"
          cp web/index.html "dist/Kwallet-v$V.html"
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Kwallet-v${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Kwallet ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            **Kwallet ${{ github.ref_name }}** — offline multi-chain HD wallet generator.

            - `Kwallet-*.apk` — Android app (no internet permission)
            - `Kwallet-*.html` — the same app as one HTML file; open it in any browser, offline
            - `SHA256SUMS.txt` — verify your download before use
