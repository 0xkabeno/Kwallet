name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # v1.8.12 (push 17, R1): Hwallet's native Monero engine = monero_c (github.com/MrCyjaneK/monero_c, LGPL-3.0) prebuilt
      # libwallet2_api_c for Android, the library Cake Wallet uses. Downloaded from its pinned release, checked against the
      # SHA-256 sums below, stripped with the NDK and placed in hwallet's jniLibs. Never committed to this repository.
      - name: Cache monero_c
        uses: actions/cache@v4
        with:
          path: ~/monero_c
          key: monero_c-v0.18.4.6-RC2

      - name: Native Monero engine (monero_c v0.18.4.6-RC2)
        run: |
          set -e
          D=~/monero_c; mkdir -p $D
          if [ ! -f $D/ok ]; then
            for i in 1 2 3; do curl -fsSL -o $D/bundle.zip https://github.com/MrCyjaneK/monero_c/releases/download/v0.18.4.6-RC2/release-bundle.zip && break; sleep 10; done
            (cd $D && unzip -qo bundle.zip 'v0.18.4.6-RC2/aarch64-linux-android/libmonero_wallet2_api_c.so' 'v0.18.4.6-RC2/armv7a-linux-androideabi/libmonero_wallet2_api_c.so' 'v0.18.4.6-RC2/x86_64-linux-android/libmonero_wallet2_api_c.so' && rm -f bundle.zip)
            touch $D/ok
          fi
          cd $D/v0.18.4.6-RC2
          printf '%s\n' \
            '0ebd46d3adf41692ff84efc1fbdbe5d287dea944a7c455f4a45f2680ce7b8cdc  aarch64-linux-android/libmonero_wallet2_api_c.so' \
            '6a03dae018c702db3ab0d85b1182105b7a6821d4e95564d3f89ae860adeec319  armv7a-linux-androideabi/libmonero_wallet2_api_c.so' \
            '019e7dddcb4bcb76167426d4a4765e41e5e6217555850f519ac985e527f4dc80  x86_64-linux-android/libmonero_wallet2_api_c.so' | sha256sum -c -
          STRIP=$(ls ${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip 2>/dev/null || true)
          J=$GITHUB_WORKSPACE/hwallet/app/src/main/jniLibs
          for m in "aarch64-linux-android arm64-v8a" "armv7a-linux-androideabi armeabi-v7a" "x86_64-linux-android x86_64"; do
            set -- $m; mkdir -p $J/$2; cp $1/libmonero_wallet2_api_c.so $J/$2/
            if [ -n "$STRIP" ]; then "$STRIP" --strip-unneeded $J/$2/libmonero_wallet2_api_c.so; fi
          done
          ls -la $J/*

      - name: Read version
        id: ver
        run: |
          V=$(grep -oP "const APP_VERSION = '\K[0-9.]+" web/index.html | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          H=$(grep -oP "var APP_VERSION = '\K[0-9.]+" hwallet/web/index.html | head -1)
          echo "hversion=$H" >> "$GITHUB_OUTPUT"
          echo "Kwallet v$V, Hwallet v$H"

      - name: Release keystore
        env:
          KWALLET_SIGNING: ${{ secrets.KWALLET_SIGNING }}
        run: |
          if [ -n "$KWALLET_SIGNING" ]; then
            PASS="${KWALLET_SIGNING%%:*}"
            echo "::add-mask::$PASS"
            echo "${KWALLET_SIGNING#*:}" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/kwallet.p12"
            {
              echo "KW_KEYSTORE=$RUNNER_TEMP/kwallet.p12"
              echo "KW_STORE_PASSWORD=$PASS"
              echo "KW_KEY_PASSWORD=$PASS"
              echo "KW_KEY_ALIAS=kwallet"
            } >> "$GITHUB_ENV"
            echo "Signing with the permanent Kwallet key"
          else
            echo "::warning::KWALLET_SIGNING secret missing - APK signed with a temporary debug key"
          fi

      # Hwallet's provider keys (v1.6): sealed into the APK at build time with AES-GCM under a per-build split key
      # (hwallet/app/build.gradle.kts, genHwSecrets). Only this step sees them; GitHub masks them in logs. Any that are
      # missing (forks, PRs from forks) leave that provider keyless and the build still succeeds.
      - name: Build
        env:
          KW_ALCHEMY_KEY: ${{ secrets.KW_ALCHEMY_KEY }}
          KW_ETHERSCAN_KEY: ${{ secrets.KW_ETHERSCAN_KEY }}
          KW_HELIUS_KEY: ${{ secrets.KW_HELIUS_KEY }}
          KW_TRONGRID_KEY: ${{ secrets.KW_TRONGRID_KEY }}
          KW_LIFI_KEY: ${{ secrets.KW_LIFI_KEY }}
          KW_JUPITER_KEY: ${{ secrets.KW_JUPITER_KEY }}
          KW_REOWN_PROJECT_ID: ${{ secrets.KW_REOWN_PROJECT_ID }}
        run: gradle --no-daemon assembleRelease

      - name: Hwallet unit tests (data speed limit)
        run: gradle --no-daemon :hwallet:testReleaseUnitTest

      - name: Verify signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -5
          "$APKSIGNER" verify --print-certs hwallet/app/build/outputs/apk/release/hwallet-release.apk | head -5
          K=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 SHA-256)
          H=$("$APKSIGNER" verify --print-certs hwallet/app/build/outputs/apk/release/hwallet-release.apk | grep -m1 SHA-256)
          [ "${K#*: }" = "${H#*: }" ] || { echo "::error::Kwallet and Hwallet must be signed with the same key"; exit 1; }

      - name: Package
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Kwallet-v$V.apk"
          cp web/index.html "dist/Kwallet-v$V.html"
          HV=${{ steps.ver.outputs.hversion }}
          cp hwallet/app/build/outputs/apk/release/hwallet-release.apk "dist/Hwallet-v$HV.apk"
          cp hwallet/web/index.html "dist/Hwallet-v$HV.html"
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Kwallet-v${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Kwallet ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            **Kwallet ${{ github.ref_name }}** — offline multi-chain HD wallet generator, plus **Hwallet v${{ steps.ver.outputs.hversion }}**, its online watch-only companion.

            - `Kwallet-*.apk` — Android app (no internet permission)
            - `Kwallet-*.html` — the same app as one HTML file; open it in any browser, offline
            - `Hwallet-*.apk` — Android watch-only app: live balances, asks Kwallet on the same phone to sign
            - `Hwallet-*.html` — Hwallet in a browser (balances; signing needs the Android apps)
            - `SHA256SUMS.txt` — verify your download before use
