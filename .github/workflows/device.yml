name: Device check (emulator)

# v3.97 P0: the real-device check that the headless tests missed. Builds the debug APKs (and keyless release APKs with
# WebView DevTools on, -PkwE2E=true, to catch R8-only bugs), boots an API 34 x86_64 emulator, installs Kwallet +
# Hwallet and drives: launch H, Browser -> google.com, Swap (+ token picker), pull to refresh, launch K.
# Screenshots, logcat and results.json are uploaded as the "device-check" artifact. Needs no secrets.
on:
  push:
    branches: [main, "v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true


jobs:
  emulator:
    name: Emulator flows (API ${{ matrix.api }}, emulator build ${{ matrix.emu || 'latest' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Diagnostics on every entry: logcat -b all streamed to a file from boot, -show-kernel guest kernel log in the job
    # log, host dmesg + emulator crash db after the passes. VIBRATE appop ignored and ringer silent (no haptics / Web
    # Audio in the apps); neither was the cause of the API 34 deaths but they keep the runs quiet and deterministic.
    strategy:
      fail-fast: false
      matrix:
        include:
          # attempts 1-4 (runs 38172608215, 38173266061, 38173986730, 38174850301): API 30 passes every time. API 34/35 on
          # emulator 37.2.12 lose the whole emulator process ~0.5-1 s after a WebView app (Hwallet, once Kwallet) shows
          # its first frame - not haptics, audio, guest Vulkan, GPU mode or the display-mode request (9/10 boots died at
          # random points). Attempt 5 pins older emulator builds (dl.google.com emulator-linux_x64-<build>.zip).
          - { api: 30, emu: "", diag: false }
          - { api: 34, emu: "11237101", diag: true }
          - { api: 34, emu: "12414864", diag: true }
          - { api: 34, emu: "15004761", diag: true }
    continue-on-error: ${{ matrix.diag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APKs (debug + keyless release with E2E DevTools)
        run: |
          gradle --no-daemon assembleDebug
          gradle --no-daemon -PkwE2E=true assembleRelease
          ls -la app/build/outputs/apk/*/ hwallet/app/build/outputs/apk/*/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Python deps
        run: pip install websocket-client==1.8.0

      # cold boot every run (a cached quickboot snapshot froze adb on the first try); 4 cores, a 1080x1920 screen
      - name: Run flows on the emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          emulator-build: ${{ matrix.emu }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          heap-size: 512M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -show-kernel -camera-back none -camera-front none
          disable-animations: true
          script: VIB=block RINGER=silent SKIP= bash ci/device_check.sh

      - name: Host diagnostics (dmesg, emulator crash reports)
        if: always()
        run: |
          mkdir -p device-out/host
          sudo dmesg -T > device-out/host/dmesg.txt 2>&1 || true
          grep -iE "qemu|emulator|oom|killed process|segfault|trap" device-out/host/dmesg.txt | tail -50 || true
          free -m > device-out/host/free.txt; nproc >> device-out/host/free.txt
          ls -laR /tmp/android-runner /tmp/android-$USER 2>/dev/null | head -100 > device-out/host/tmp_ls.txt || true
          cp -r /tmp/android-runner device-out/host/ 2>/dev/null || true
          cp ~/.android/avd/test.avd/config.ini device-out/host/avd_config.ini 2>/dev/null || true
          find ~/.android -name "*.dmp" -o -name "*crash*" 2>/dev/null | head > device-out/host/crash_files.txt || true

      - name: Upload screenshots + logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-check-api${{ matrix.api }}-${{ strategy.job-index }}
          path: device-out/
          if-no-files-found: warn
