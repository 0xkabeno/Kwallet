name: Device check (emulator)

# v3.97 P0: the real-device check that the headless tests missed. Builds the debug APKs (and keyless release APKs with
# WebView DevTools on, -PkwE2E=true, to catch R8-only bugs), boots an API 34 x86_64 emulator, installs Kwallet +
# Hwallet and drives: launch H, Browser -> google.com, Swap (+ token picker), pull to refresh, launch K.
# Screenshots, logcat and results.json are uploaded as the "device-check" artifact. Needs no secrets.
on:
  push:
    branches: [main, "v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true


jobs:
  emulator:
    name: Emulator flows (API ${{ matrix.api }}, gpu ${{ matrix.gpu }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Two emulator setups side by side: on the first two runs the API 34 emulator process died ~2 s after Hwallet
    # launched with -gpu swiftshader_indirect (host-side renderer). gpu=guest renders inside the VM instead.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 34, gpu: guest }
          - { api: 33, gpu: swiftshader_indirect }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APKs (debug + keyless release with E2E DevTools)
        run: |
          gradle --no-daemon assembleDebug
          gradle --no-daemon -PkwE2E=true assembleRelease
          ls -la app/build/outputs/apk/*/ hwallet/app/build/outputs/apk/*/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Python deps
        run: pip install websocket-client==1.8.0

      # cold boot every run (a cached quickboot snapshot froze adb on the first try); 4 cores, a 1080x1920 screen
      - name: Run flows on the emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 4
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-snapshot -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash ci/device_check.sh

      - name: Upload screenshots + logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-check-api${{ matrix.api }}-${{ matrix.gpu }}
          path: device-out/
          if-no-files-found: warn
