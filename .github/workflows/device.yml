name: Device check (emulator)

# v3.97 P0: the real-device check that the headless tests missed. Builds the debug APKs (and keyless release APKs with
# WebView DevTools on, -PkwE2E=true, to catch R8-only bugs), boots an API 34 x86_64 emulator, installs Kwallet +
# Hwallet and drives: launch H, Browser -> google.com, Swap (+ token picker), pull to refresh, launch K.
# Screenshots, logcat and results.json are uploaded as the "device-check" artifact. Needs no secrets.
on:
  push:
    branches: [main, "v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true


jobs:
  emulator:
    name: Emulator flows (API ${{ matrix.api }}, skip '${{ matrix.skip }}', xvfb ${{ matrix.xvfb }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # P0b: the emulator process died ~2 s after Hwallet launched (4/4 boots, API 33/34, host + guest GPU, -noaudio).
    # Suspect: Hwallet's opening haptic (HarkNative.vibrate) -> the headless emulator's vibration handler.
    # vib=block runs `appops set <pkg> VIBRATE ignore` before launch; vib=allow is the diagnostic control (may die, never
    # fails the run). Diagnostics on every entry: logcat -b all streamed to a file from boot, -show-kernel guest
    # kernel log in the job log, host dmesg + emulator crash db after the passes.
    strategy:
      fail-fast: false
      matrix:
        include:
          # attempts 1-3 (runs 38172608215, 38173266061, 38173986730): API 30 passes; API 34/35 die ~0.5-1 s after
          # Hwallet's first frame whatever the haptics, audio (ringer silent: no AAudio stream at all), guest Vulkan or
          # GPU mode. Attempt 4 bisects the window tuning (skip = kw_e2e_skip extra, debug/E2E builds only) and tries a
          # real (Xvfb) window instead of -no-window.
          - { api: 30, skip: "", win: "-no-window", xvfb: false, diag: false }
          - { api: 34, skip: "mode,perf", win: "-no-window", xvfb: false, diag: false }
          - { api: 34, skip: "mode", win: "-no-window", xvfb: false, diag: true }
          - { api: 34, skip: "", win: "", xvfb: true, diag: true }
    continue-on-error: ${{ matrix.diag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APKs (debug + keyless release with E2E DevTools)
        run: |
          gradle --no-daemon assembleDebug
          gradle --no-daemon -PkwE2E=true assembleRelease
          ls -la app/build/outputs/apk/*/ hwallet/app/build/outputs/apk/*/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Xvfb (windowed emulator variant)
        if: matrix.xvfb
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libxkbfile1 libxcb-cursor0 >/dev/null
          Xvfb :99 -screen 0 1280x2100x24 >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Python deps
        run: pip install websocket-client==1.8.0

      # cold boot every run (a cached quickboot snapshot froze adb on the first try); 4 cores, a 1080x1920 screen
      - name: Run flows on the emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          heap-size: 512M
          emulator-options: -no-snapshot ${{ matrix.win }} -gpu swiftshader_indirect -no-boot-anim -show-kernel -camera-back none -camera-front none
          disable-animations: true
          script: VIB=block RINGER=silent SKIP=${{ matrix.skip }} bash ci/device_check.sh

      - name: Host diagnostics (dmesg, emulator crash reports)
        if: always()
        run: |
          mkdir -p device-out/host
          sudo dmesg -T > device-out/host/dmesg.txt 2>&1 || true
          grep -iE "qemu|emulator|oom|killed process|segfault|trap" device-out/host/dmesg.txt | tail -50 || true
          free -m > device-out/host/free.txt; nproc >> device-out/host/free.txt
          ls -laR /tmp/android-runner /tmp/android-$USER 2>/dev/null | head -100 > device-out/host/tmp_ls.txt || true
          cp -r /tmp/android-runner device-out/host/ 2>/dev/null || true
          cp ~/.android/avd/test.avd/config.ini device-out/host/avd_config.ini 2>/dev/null || true
          find ~/.android -name "*.dmp" -o -name "*crash*" 2>/dev/null | head > device-out/host/crash_files.txt || true

      - name: Upload screenshots + logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-check-api${{ matrix.api }}-${{ strategy.job-index }}
          path: device-out/
          if-no-files-found: warn
